# foxchess.foxugly.com — installé par le déploiement depuis le blob git validé
# (/etc/nginx/sites-available/foxchess.foxugly.com), vérifié par `nginx -t`
# avant rechargement. Modifier ce fichier dans le dépôt, jamais sur la machine.

# Limites de débit (contexte `http` : ce fichier y est inclus via sites-enabled ;
# noms préfixés `foxchess_`, les zones sont globales à nginx).
#
# `foxchess_coups` : chaque coup lance Stockfish (jusqu'à 1 s de CPU au niveau
# 8). 2 requêtes/s par IP, rafale de 6 : bien au-dessus d'un humain qui joue,
# bien en dessous de ce qu'il faut pour monopoliser la machine.
limit_req_zone $binary_remote_addr zone=foxchess_coups:10m rate=2r/s;
# `foxchess_admin_login` : /admin/login/, la seule page à mot de passe.
limit_req_zone $binary_remote_addr zone=foxchess_admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name foxchess.foxugly.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foxchess.foxugly.com;

    ssl_certificate /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/foxchess.access.log;
    error_log /var/log/nginx/foxchess.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Django pose ses propres en-têtes de sécurité (CSP avec nonce, HSTS,
    # X-Frame-Options, nosniff, Referrer-Policy) ; ici seulement ce qu'il
    # n'envoie jamais. add_header ne s'hérite pas dans un location qui en pose
    # (OPERATIONS.md §3.19) : /static/ répète les siens.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 1M;

    location ^~ /static/ {
        alias /var/www/django_websites/foxChess/staticfiles/;
        expires 7d;
        access_log off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /health/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Ce qui lance Stockfish ou crée une partie.
    location ~ ^/parties/(nouvelle/|[0-9a-f-]+/(jouer|moteur)/)$ {
        limit_req zone=foxchess_coups burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    location = /admin/login/ {
        limit_req zone=foxchess_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
